<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>이순신 장군과 판옥선 · 3D 배치</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#112033;color:#fff}header{padding:12px 18px;background:#18304a}h2{font-size:21px;margin:0 0 5px}header small{color:#d2deeb}#view{height:68vh;min-height:360px;touch-action:none}#msg{padding:9px 16px;background:#132338;color:#d6e8ff;min-height:39px}#controls{display:flex;flex-wrap:wrap;align-items:center;gap:13px 22px;background:#233a54;padding:14px}label{display:flex;align-items:center;gap:7px;font-size:14px}input[type=range]{width:130px;accent-color:#4187fa}output{min-width:43px;font-variant-numeric:tabular-nums}button{background:#f5ce79;border:0;border-radius:6px;padding:9px 13px;cursor:pointer}button:hover{background:#ffe2a4}.hint{padding:10px 16px;color:#c3d3e6;font-size:13px}select{padding:6px;border-radius:5px} @media(max-width:600px){#view{height:55vh}label{width:100%;justify-content:space-between}input[type=range]{width:46%}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head><body>
<header><h2>이순신 장군과 판옥선</h2><small>선수 갑판 배치 실험 · 드래그 회전 · 휠/두 손가락 확대·축소</small></header>
<div id="view"></div><div id="msg">3D 모델을 불러오는 중...</div>
<section id="controls">
<label>좌우 X <input id="x" type="range" min="-0.5" max="0.5" step="0.005" value="0"><output id="xo"></output></label>
<label>높이 Y <input id="y" type="range" min="-0.5" max="0.7" step="0.005" value="0.02"><output id="yo"></output></label>
<label>앞뒤 Z <input id="z" type="range" min="-0.55" max="0.55" step="0.005" value="-0.28"><output id="zo"></output></label>
<label>크기 <input id="scale" type="range" min="0.04" max="0.55" step="0.005" value="0.17"><output id="scaleo"></output></label>
<label>회전 <input id="rotation" type="range" min="-180" max="180" step="1" value="180"><output id="rotationo"></output></label>
<button id="front">선수 방향 바꾸기</button><button id="reset">초기화</button><button id="save">설정값 복사</button>
</section><div class="hint">장군이 지붕 위에 보이면 높이 Y를 내리고, 선수 반대편에 있으면 ‘선수 방향 바꾸기’를 누르세요. 발이 갑판에 닿도록 조정하세요.</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const view=document.querySelector('#view'),msg=document.querySelector('#msg');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeaf1f7);
const camera=new THREE.PerspectiveCamera(45,1,0.01,100);camera.position.set(1.3,0.85,1.6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;view.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.45;orbit.maxDistance=7;
scene.add(new THREE.HemisphereLight(0xffffff,0x8995a7,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(2,5,3);scene.add(sun);
const ship=new THREE.Group();scene.add(ship);let admiral=null,frontSign=-1;
const ids=['x','y','z','scale','rotation'];const inputs=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const defaults={x:0,y:0.02,z:-0.28,scale:0.17,rotation:180};
function update(){for(const id of ids)document.getElementById(id+'o').textContent=inputs[id].value;if(!admiral)return;admiral.position.set(+inputs.x.value,+inputs.y.value,frontSign*Math.abs(+inputs.z.value));admiral.scale.setScalar(+inputs.scale.value);admiral.rotation.y=+inputs.rotation.value*Math.PI/180;}
for(const id of ids)inputs[id].addEventListener('input',()=>{if(id==='z')frontSign=Math.sign(+inputs.z.value)||frontSign;update()});
document.getElementById('front').onclick=()=>{frontSign*=-1;inputs.z.value=(frontSign*Math.max(.2,Math.abs(+inputs.z.value))).toFixed(3);inputs.rotation.value=String((+inputs.rotation.value+180+180)%360-180);update()};
document.getElementById('reset').onclick=()=>{frontSign=-1;for(const id of ids)inputs[id].value=defaults[id];update()};
document.getElementById('save').onclick=async()=>{const s=ids.map(id=>id+'='+inputs[id].value).join(', ');try{await navigator.clipboard.writeText(s);msg.textContent='복사 완료: '+s}catch{msg.textContent='설정값: '+s}};
const loader=new GLTFLoader();function load(url){return new Promise((resolve,reject)=>loader.load(url,g=>resolve(g.scene),undefined,e=>reject(new Error(url+' : '+(e.message||e)))))}
function normalize(model){const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());model.position.sub(c);model.scale.setScalar(1/Math.max(s.x,s.y,s.z));return model;}
Promise.all([load('./Sketchfab_panokseon.glb'),load('./admiral-yi-sunsin.glb')]).then(([boat,person])=>{
ship.add(normalize(boat));
// Normalize the character in its own local coordinates. Place its feet at y=0, not its torso center.
const b=new THREE.Box3().setFromObject(person),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());person.position.set(-c.x,-b.min.y,-c.z);person.scale.setScalar(1/Math.max(s.x,s.y,s.z));
admiral=new THREE.Group();admiral.add(person);ship.add(admiral);
const shipBox=new THREE.Box3().setFromObject(boat);const center=shipBox.getCenter(new THREE.Vector3());orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1.2,.72,1.5));orbit.update();update();
msg.textContent='Sketchfab 판옥선과 이순신 장군 로딩 완료 · 새 판옥선의 좌표에 맞게 장군 위치를 조정하세요.';
}).catch(e=>{console.error(e);msg.textContent='모델 로딩 오류: '+e.message+' · GLB 파일명과 GitHub Pages 경로를 확인하세요.'});
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();update();
</script></body></html>
