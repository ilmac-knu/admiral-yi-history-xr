<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이순신 장군과 판옥선 | 3D 역사 체험</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#101a29;color:white}header{padding:12px 18px;background:#172b43}h2{margin:0;font-size:20px}small{color:#bac9d9}#view{height:65vh;min-height:360px;touch-action:none}aside{padding:12px 18px;background:#20334a;display:flex;flex-wrap:wrap;gap:14px;align-items:center}label{display:flex;align-items:center;gap:7px;font-size:14px}input{width:125px}output{min-width:45px}button{background:#f5cc78;border:0;border-radius:6px;padding:9px 13px;cursor:pointer}#msg{padding:8px 18px;color:#d4e4f7}</style></head><body><header><h2>이순신 장군과 판옥선</h2><small>드래그: 회전 · 휠/두 손가락: 확대·축소 · 장군 위치를 조정하세요</small></header><div id="view"></div><div id="msg">3D 모델을 불러오는 중...</div><aside id="controls"><label>좌우 X <input id="x" type="range" min="-0.5" max="0.5" step="0.005" value="0"><output id="xo"></output></label><label>높이 Y <input id="y" type="range" min="-0.4" max="0.7" step="0.005" value="0.12"><output id="yo"></output></label><label>앞뒤 Z <input id="z" type="range" min="-0.5" max="0.5" step="0.005" value="0"><output id="zo"></output></label><label>크기 <input id="scale" type="range" min="0.04" max="0.6" step="0.005" value="0.18"><output id="scaleo"></output></label><label>회전 <input id="rotation" type="range" min="-180" max="180" step="1" value="0"><output id="rotationo"></output></label><button id="reset">초기화</button><button id="save">설정값 복사</button></aside><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';const holder=document.getElementById('view'),msg=document.getElementById('msg');const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9f0f5);const camera=new THREE.PerspectiveCamera(45,1,.01,100);camera.position.set(1.7,1.15,1.7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;holder.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,0,0);orbit.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x8b9aaf,2.5));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(2,4,3);scene.add(light);const loader=new GLTFLoader();let admiral;const ship=new THREE.Group();scene.add(ship);function load(url){return new Promise((resolve,reject)=>loader.load(url,g=>resolve(g.scene),undefined,reject))}Promise.all([load('./panokseon.glb'),load('./admiral-yi-sunsin.glb')]).then(([boat,person])=>{ship.add(boat);admiral=person;ship.add(admiral);update();msg.textContent='모델 로딩 완료 · 슬라이더로 장군을 지휘소에 배치하세요. 설정값을 알려주시면 고정할 수 있습니다.'}).catch(e=>{msg.textContent='모델 로딩 오류: '+e.message+' (GitHub Pages에서 실행했는지 확인하세요.)'});const ids=['x','y','z','scale','rotation'];function update(){ids.forEach(id=>document.getElementById(id+'o').textContent=document.getElementById(id).value);if(!admiral)return;admiral.position.set(+x.value,+y.value,+z.value);admiral.scale.setScalar(+scale.value);admiral.rotation.y=+rotation.value*Math.PI/180}const x=document.getElementById('x'),y=document.getElementById('y'),z=document.getElementById('z'),scale=document.getElementById('scale'),rotation=document.getElementById('rotation');ids.forEach(id=>document.getElementById(id).addEventListener('input',update));document.getElementById('reset').onclick=()=>{['0','0.12','0','0.18','0'].forEach((v,i)=>document.getElementById(ids[i]).value=v);update()};document.getElementById('save').onclick=async()=>{const s=ids.map(id=>id+'='+document.getElementById(id).value).join(', ');try{await navigator.clipboard.writeText(s);msg.textContent='설정값 복사 완료: '+s}catch{msg.textContent='설정값: '+s}};function resize(){const w=holder.clientWidth,h=holder.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();update();</script></body></html>
