<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이순신 장군과 판옥선 | 3D 역사 체험</title>
<style>*{box-sizing:border-box}body{margin:0;background:#102035;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif}header{background:#1c3049;padding:12px 18px}h2{margin:0 0 5px;font-size:21px}small{color:#d4e0ee}#view{height:65vh;min-height:350px;touch-action:none}#status{padding:10px 16px;background:#16273d;color:#e0eeff}#controls{display:flex;gap:12px 20px;flex-wrap:wrap;align-items:center;background:#263e5b;padding:13px}label{display:flex;gap:7px;align-items:center;font-size:14px}input[type=range]{width:120px;accent-color:#4e8cf9}output{min-width:40px}button{padding:10px 12px;background:#f3ce7c;border:0;border-radius:5px;cursor:pointer}button:hover{background:#ffe3a7}.note{padding:9px 15px;color:#c7d6e7;font-size:13px}@media(max-width:650px){#view{height:53vh}label{width:100%;justify-content:space-between}input[type=range]{width:48%}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body>
<header><h2>이순신 장군과 판옥선</h2><small>Sketchfab 판옥선 + 직접 제작한 이순신 장군 · 마우스/손가락 회전 · 확대·축소</small></header>
<div id="view"></div><div id="status">3D 모델을 불러오는 중입니다. 판옥선 파일은 약 27MB입니다…</div>
<div id="controls">
<label>좌우 <input id="x" type="range" min="-100" max="100" value="40"><output id="xo">0</output></label>
<label>앞뒤 <input id="z" type="range" min="-100" max="100" value="60"><output id="zo">60</output></label>
<label>높이 보정 <input id="y" type="range" min="-100" max="100" value="0"><output id="yo">0</output></label>
<label>장군 크기 <input id="scale" type="range" min="5" max="100" value="45"><output id="scaleo">45</output></label>
<label>장군 회전 <input id="rotation" type="range" min="-180" max="180" value="0"><output id="rotationo">0</output></label>
<button id="front">선수 반대쪽으로</button><button id="find">장군 가까이 보기</button><button id="reset">초기화</button><button id="save">설정값 복사</button>
</div><div class="note">장군은 선체 크기에 맞춰 자동으로 조정됩니다. 높이는 갑판 표면을 추정하여 맞춥니다. 잘 보이지 않으면 ‘장군 가까이 보기’를 누르세요. 장군은 기본적으로 지휘소 계단 앞쪽(돛대 오른편)에 서서 정면을 바라봅니다. 장군 회전 0이 정면이며 슬라이더로 방향을 바꿀 수 있습니다.</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const view=document.getElementById('view'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeaf1f7);
const camera=new THREE.PerspectiveCamera(45,1,.01,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;view.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.15;orbit.maxDistance=40;
scene.add(new THREE.HemisphereLight(0xffffff,0x8995a8,2.8));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(5,10,7);scene.add(sun);
const root=new THREE.Group();scene.add(root);let boat,person,admiral,boatBox,axis='z',length=4,width=2,hullY=0,boatHeight=3,sign=1,ready=false;
const defaults={x:40,z:60,y:0,scale:45,rotation:0};const keys=Object.keys(defaults),el=Object.fromEntries(keys.map(k=>[k,document.getElementById(k)]));
function values(){return Object.fromEntries(keys.map(k=>[k,+el[k].value]))}
function outputs(){keys.forEach(k=>document.getElementById(k+'o').textContent=el[k].value)}
function locate(){outputs();if(!ready)return;const v=values();
// Longitudinal axis is inferred from the ship's actual dimensions.
const forward=(v.z/100)*length*.44*sign,side=(v.x/100)*width*.44;
const px=axis==='x'?forward:side,pz=axis==='z'?forward:side;
// Find a deck-like horizontal surface below the sail and above the bottom of the hull.
const ray=new THREE.Raycaster(new THREE.Vector3(px,boatBox.max.y+2,pz),new THREE.Vector3(0,-1,0));
const hits=ray.intersectObject(boat,true);let deck=null;
for(const hit of hits){if(hit.point.y>boatBox.min.y+boatHeight*.10 && hit.point.y<boatBox.min.y+boatHeight*.55){deck=hit.point.y;break}}
const base=deck??hullY;
admiral.position.set(px,base+v.y/100*boatHeight*.28,pz);
const personHeight=length*(v.scale/100)*.34;
admiral.scale.setScalar(personHeight);
admiral.rotation.y=(180+v.rotation+(axis==='x'?90:0)+(sign<0?180:0))*Math.PI/180;
}
keys.forEach(k=>el[k].addEventListener('input',locate));
document.getElementById('front').onclick=()=>{sign*=-1;locate()};
document.getElementById('reset').onclick=()=>{sign=1;keys.forEach(k=>el[k].value=defaults[k]);locate();frameBoat()};
document.getElementById('save').onclick=async()=>{const t=keys.map(k=>k+'='+el[k].value).join(', ') + ', 선수방향='+sign;try{await navigator.clipboard.writeText(t);status.textContent='설정값 복사 완료: '+t}catch{status.textContent='설정값: '+t}};
document.getElementById('find').onclick=()=>{if(!ready)return;const p=admiral.position.clone();orbit.target.copy(p).add(new THREE.Vector3(0,length*.08,0));camera.position.copy(p).add(new THREE.Vector3(length*.35,length*.25,length*.35));orbit.update()};
function frameBoat(){if(!ready)return;const center=boatBox.getCenter(new THREE.Vector3());orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(length*.85,length*.48,length*.95));orbit.update()}
const loader=new GLTFLoader();function load(url){return new Promise((resolve,reject)=>loader.load(url,g=>resolve(g.scene),e=>{if(e.total)status.textContent='모델 다운로드 중: '+Math.round(e.loaded/e.total*100)+'%'},e=>reject(new Error(url+' — '+(e.message||e)))))}
Promise.all([load('./Sketchfab_panokseon.glb'),load('./admiral-yi-sunsin.glb')]).then(([ship,figure])=>{
boat=ship;root.add(boat);
// Normalize the entire boat to a stable 4-unit overall size, preserving its original orientation.
let box=new THREE.Box3().setFromObject(boat),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
const factor=4/Math.max(size.x,size.y,size.z);boat.scale.multiplyScalar(factor);boat.position.sub(center.multiplyScalar(factor));boat.updateMatrixWorld(true);
boatBox=new THREE.Box3().setFromObject(boat);size=boatBox.getSize(new THREE.Vector3());axis=size.x>=size.z?'x':'z';length=Math.max(size.x,size.z);width=Math.min(size.x,size.z);boatHeight=size.y;
hullY=boatBox.min.y+boatHeight*.32;
// Normalize figure independently. Its feet are anchored to local Y=0.
const fb=new THREE.Box3().setFromObject(figure),fs=fb.getSize(new THREE.Vector3()),fc=fb.getCenter(new THREE.Vector3());
figure.position.set(-fc.x,-fb.min.y,-fc.z);figure.scale.setScalar(1/Math.max(fs.y,.0001));
admiral=new THREE.Group();admiral.add(figure);root.add(admiral);ready=true;locate();frameBoat();
status.textContent='두 GLB 로딩 완료 · 계단 앞 배치 및 정면 방향 적용 · 장군이 안 보이면 「장군 가까이 보기」를 클릭하세요. 좌우·앞뒤·높이로 배치를 조정할 수 있습니다.';
}).catch(err=>{console.error(err);status.textContent='불러오기 실패: '+err.message});
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
(function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)})();outputs();
</script></body></html>
